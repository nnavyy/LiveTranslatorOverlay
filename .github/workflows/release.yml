name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: ${{ !endsWith(github.ref_name, '-mac-preview') }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LiveTranslatorOverlay.csproj

      - name: Build and run offline regression checks
        run: |
          dotnet build LiveTranslatorOverlay.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/RegressionChecks/RegressionChecks.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Additional audit regressions
        run: dotnet run --project tests/AuditChecks/AuditChecks.csproj -c Release --nologo

      - name: Speaker attribution and popup scrolling checks
        run: dotnet run --project tests/SpeakerChecks/SpeakerChecks.csproj -c Release --nologo

      - name: Key-free defaults and download cancellation checks
        run: dotnet run --project tests/LocalCpuChecks/LocalCpuChecks.csproj -c Release --nologo

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [xml]$project = Get-Content LiveTranslatorOverlay.csproj
          $expectedTag = 'v' + $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne $expectedTag) { throw "Release tag must be $expectedTag" }

      - name: Publish Release Build
        run: ./scripts/package-windows.ps1

      - name: Package ZIP
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./LiveTranslatorOverlay-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: LiveTranslatorOverlay-Windows-x64.zip

  mac-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify Mac preview tag matches application version
        if: startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '-mac-preview')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as e; print(e.parse("MacApp/LiveTranslatorMac.csproj").findtext("PropertyGroup/Version"))')
          test "$RELEASE_TAG" = "v$version-mac-preview"
      - name: Build, package and smoke-test native Mac preview
        shell: bash
        run: bash MacApp/package-macos.sh '${{ matrix.rid }}' "$RUNNER_TEMP/mac-preview"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-preview-${{ matrix.rid }}
          path: ${{ runner.temp }}/mac-preview/*.zip

  publish:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.mac-preview.result == 'success' && (needs.windows.result == 'success' || (endsWith(github.ref_name, '-mac-preview') && needs.windows.result == 'skipped')) }}
    needs: [windows, mac-preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create versioned release
        if: ${{ !endsWith(github.ref_name, '-mac-preview') }}
        uses: softprops/action-gh-release@v2
        with:
          name: "Windows x64 — Live Translator Overlay ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: release-assets/LiveTranslatorOverlay-Windows-x64.zip
      - name: Publish separate Mac developer preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ endsWith(github.ref_name, '-mac-preview') && github.ref_name || format('{0}-mac-preview', github.ref_name) }}
          target_commitish: ${{ github.sha }}
          name: "macOS — Apple Silicon & Intel developer preview ${{ github.ref_name }}"
          prerelease: true
          make_latest: false
          body_path: MacApp/RELEASE_NOTES.md
          files: release-assets/LiveTranslatorOverlay-Mac-preview-*.zip
