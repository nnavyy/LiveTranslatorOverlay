name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LiveTranslatorOverlay.csproj

      - name: Publish Release Build
        run: dotnet publish LiveTranslatorOverlay.csproj -c Release -o ./publish

      - name: Copy Clean appsettings Template
        run: |
          Copy-Item -Force ./appsettings.example.json ./publish/appsettings.json

      - name: Package ZIP
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./LiveTranslatorOverlay-Windows-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Live Translator Overlay ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ./LiveTranslatorOverlay-Windows-x64.zip
